<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diamond Ring</title>
  <style>
    :root { color-scheme: dark; }
    body {
      align-items: center;
      background: #08070b;
      color: #d6dce8;
      display: flex;
      flex-direction: column;
      font: 16px Consolas, monospace;
      gap: 18px;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      text-align: center;
    }
    img {
      max-height: 80vh;
      max-width: min(90vw, 900px);
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    img.ready { opacity: 1; }
    p { color: #787080; margin: 0; }
  </style>
</head>
<body>
  <img id="ring" src="images/preview.gif" alt="Animasi cincin berlian">
  <p>Mau ga? · @anggit.suryan</p>
  <script>
    const ring = document.getElementById("ring");
    ring.addEventListener("load", () => {
      setTimeout(() => ring.classList.add("ready"), 800);
    }, { once: true });
  </script>
</body>
</html>
