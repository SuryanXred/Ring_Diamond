name: Build and deploy web version

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install web dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Build Pygbag application
        run: python -m pygbag --build main.py
      - name: Bundle BrowserFS runtime dependency
        run: |
          curl --fail --location \
            https://cdn.jsdelivr.net/npm/browserfs@1.4.3/dist/browserfs.min.js \
            --output build/web/browserfs.min.js
          sed -i \
            's#https://pygame-web.github.io/cdn/0.9.3//browserfs.min.js#browserfs.min.js#' \
            build/web/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
